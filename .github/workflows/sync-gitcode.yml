name: Sync from GitCode

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: GitCode source branch
        required: false
        default: master
      target_branch:
        description: GitHub target branch
        required: false
        default: 9.0.0-beta.2
  push:
    paths:
      - .github/workflows/sync-gitcode.yml

permissions:
  contents: write

concurrency:
  group: sync-gitcode-${{ github.repository }}-${{ inputs.target_branch || github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge GitCode source branch into GitHub target branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPO: https://gitcode.com/cann/hcomm.git
          SOURCE_BRANCH: ${{ inputs.source_branch || 'master' }}
          TARGET_BRANCH: ${{ inputs.target_branch || '9.0.0-beta.2' }}
        run: |
          set -euxo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout "${TARGET_BRANCH}"

          git remote add gitcode "${SOURCE_REPO}"
          git fetch gitcode "${SOURCE_BRANCH}" --tags

          # Keep GitHub-only files such as this workflow, but take GitCode's version on content conflicts.
          git merge --no-edit -X theirs --allow-unrelated-histories "gitcode/${SOURCE_BRANCH}"

          git push origin "HEAD:${TARGET_BRANCH}"
          git push origin --tags
